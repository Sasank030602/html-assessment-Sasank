<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comprehensive Registration Form</title>
</head>

<body bgcolor="#f0f8ff">

    <h1 align="center">Comprehensive Registration Form</h1>

    <form action="#" method="post" autocomplete="on">

        <!-- Section 1 -->
        <fieldset>
            <legend><b>Personal Information</b></legend>

            <label for="fullname">Full Name:</label><br>
            <input 
                type="text" 
                id="fullname" 
                name="fullname"
                placeholder="Enter your full name"
                required
                minlength="3"
                maxlength="40"
                autofocus
                autocomplete="name">
            <br><br>

            <label for="email">Email Address:</label><br>
            <input 
                type="email" 
                id="email" 
                name="email"
                placeholder="example@email.com"
                required
                autocomplete="email">
            <br><br>

            <label for="password">Password:</label><br>
            <input 
                type="password" 
                id="password" 
                name="password"
                placeholder="Enter strong password"
                required
                minlength="8"
                maxlength="20"
                pattern="[A-Za-z0-9@#$%!]{8,20}">
            <br><br>

            <label for="age">Age:</label><br>
            <input 
                type="number" 
                id="age" 
                name="age"
                required
                min="18"
                max="60"
                step="1"
                placeholder="Enter your age">
            <br><br>

            <label for="phone">Phone Number:</label><br>
            <input 
                type="tel" 
                id="phone" 
                name="phone"
                placeholder="9876543210"
                pattern="[0-9]{10}"
                required
                maxlength="10">
            <br><br>

            <label for="website">Portfolio Website:</label><br>
            <input 
                type="url" 
                id="website" 
                name="website"
                placeholder="https://example.com"
                autocomplete="off">
            <br><br>

            <label for="readonlyid">Registration ID:</label><br>
            <input 
                type="text" 
                id="readonlyid"
                name="readonlyid"
                value="REG2026"
                readonly>
            <br><br>

        </fieldset>

        <br>

        <!-- Section 2 -->
        <fieldset>
            <legend><b>Schedule & Preferences</b></legend>

            <label for="birthdate">Date of Birth:</label><br>
            <input 
                type="date" 
                id="birthdate" 
                name="birthdate"
                required>
            <br><br>

            <label for="meetingtime">Preferred Meeting Time:</label><br>
            <input 
                type="time" 
                id="meetingtime" 
                name="meetingtime">
            <br><br>

            <label for="favcolor">Favorite Color:</label><br>
            <input 
                type="color" 
                id="favcolor" 
                name="favcolor">
            <br><br>

            <label for="experience">Experience Level:</label><br>
            Beginner
            <input 
                type="range" 
                id="experience" 
                name="experience"
                min="0"
                max="10"
                step="1">
            Expert
            <br><br>

            <label for="resume">Upload Resume:</label><br>
            <input 
                type="file" 
                id="resume" 
                name="resume"
                required>
            <br><br>

            <label for="city">Preferred City:</label><br>
            <input 
                type="text"
                id="city"
                name="city"
                list="citylist"
                placeholder="Choose or type city">
            
            <datalist id="citylist">
                <option value="Guntur">
                <option value="Hyderabad">
                <option value="Vijayawada">
                <option value="Bangalore">
                <option value="Chennai">
            </datalist>
            <br><br>

        </fieldset>

        <br>

        <!-- Section 3 -->
        <fieldset>
            <legend><b>Course Selection & Interests</b></legend>

            <label for="department">Select Department:</label><br>
            <select id="department" name="department" required>
                
                <optgroup label="Engineering">
                    <option value="cse">Computer Science</option>
                    <option value="ece">Electronics</option>
                    <option value="mech">Mechanical</option>
                </optgroup>

                <optgroup label="Management">
                    <option value="mba">MBA</option>
                    <option value="finance">Finance</option>
                    <option value="marketing">Marketing</option>
                </optgroup>

            </select>
            <br><br>

            <label for="country">Select Country:</label><br>
            <select id="country" name="country">

                <optgroup label="Asia">
                    <option value="india">India</option>
                    <option value="japan">Japan</option>
                    <option value="singapore">Singapore</option>
                </optgroup>

                <optgroup label="Europe">
                    <option value="uk">United Kingdom</option>
                    <option value="germany">Germany</option>
                    <option value="france">France</option>
                </optgroup>

            </select>
            <br><br>

            <label>Gender:</label><br>

            <input type="radio" id="male" name="gender" value="male" required>
            <label for="male">Male</label>

            <input type="radio" id="female" name="gender" value="female">
            <label for="female">Female</label>

            <input type="radio" id="other" name="gender" value="other">
            <label for="other">Other</label>

            <br><br>

            <label>Skills:</label><br>

            <input type="checkbox" id="html" name="skills" value="HTML">
            <label for="html">HTML</label><br>

            <input type="checkbox" id="python" name="skills" value="Python">
            <label for="python">Python</label><br>

            <input type="checkbox" id="java" name="skills" value="Java">
            <label for="java">Java</label><br>

            <input type="checkbox" id="sql" name="skills" value="SQL">
            <label for="sql">SQL</label><br><br>

            <label for="bio">Short Bio:</label><br>
            <textarea 
                id="bio" 
                name="bio"
                rows="5"
                cols="50"
                maxlength="200"
                placeholder="Write about yourself in maximum 200 characters"></textarea>
            <br><br>

            <label for="disabledfield">Disabled Field:</label><br>
            <input 
                type="text"
                id="disabledfield"
                value="Currently Unavailable"
                disabled>
            <br><br>

        </fieldset>

        <br>

        <!-- Buttons -->
        <input type="submit" value="Submit">
        <input type="reset" value="Reset Form">

    </form>

</body>
</html>
